name: AI Chinese string scan

on:
  push:
    branches:
      - ai/black-slang-cn-strings
    paths:
      - .github/workflows/ai-cn-string-scan.yml
      - tool/ai_scan_cn_strings.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Scan Chinese string literals
        run: python3 tool/ai_scan_cn_strings.py
      - name: Upload scan bundle
        uses: actions/upload-artifact@v4
        with:
          name: chinese-string-scan-v2
          path: scan_bundle
          if-no-files-found: error
          retention-days: 1
