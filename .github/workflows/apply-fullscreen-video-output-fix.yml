name: Apply fullscreen video output fix

on:
  pull_request:
    branches:
      - mod
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/fix-fullscreen-video-output'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-fullscreen-video-output
          fetch-depth: 0

      - name: Patch video output composition
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/plugin/pl_player/view/view.dart')
          text = path.read_text(encoding='utf-8')
          old = '''                final controller = plPlayerController.videoController!;
                final standbyController =
                    plPlayerController.standbyVideoController;
                return Transform.flip(
                  flipX: plPlayerController.flipX.value,
                  flipY: plPlayerController.flipY.value,
                  child: FittedBox(
                    fit: videoFit.boxFit,
                    alignment: widget.alignment,
                    child: Stack(
                      children: [
                        if (standbyController != null)
                          SimpleVideo(
                            key: ValueKey(standbyController),
                            controller: standbyController,
                            fill: widget.fill,
                            aspectRatio: videoFit.aspectRatio,
                          ),
                        SimpleVideo(
                          key: ValueKey(controller),
                          controller: controller,
                          fill: widget.fill,
                          aspectRatio: videoFit.aspectRatio,
                        ),
                      ],
                    ),
                  ),
                );'''
          new = '''                final controller = plPlayerController.videoController!;
                return Transform.flip(
                  flipX: plPlayerController.flipX.value,
                  flipY: plPlayerController.flipY.value,
                  child: FittedBox(
                    fit: videoFit.boxFit,
                    alignment: widget.alignment,
                    child: SimpleVideo(
                      key: ValueKey(controller),
                      controller: controller,
                      fill: widget.fill,
                      aspectRatio: videoFit.aspectRatio,
                    ),
                  ),
                );'''
          if old not in text:
              raise SystemExit('Expected video output block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/apply-fullscreen-video-output-fix.yml').unlink()

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/plugin/pl_player/view/view.dart .github/workflows/apply-fullscreen-video-output-fix.yml
          git commit -m "修复全屏切画质时左上角缩小画面"
          git push origin HEAD:agent/fix-fullscreen-video-output
