name: Apply fullscreen video output fix

on:
  pull_request:
    branches:
      - mod
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/fix-fullscreen-video-output'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-fullscreen-video-output
          fetch-depth: 0

      - name: Patch video output composition
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/plugin/pl_player/view/view.dart')
          text = path.read_text(encoding='utf-8')
          start_marker = (
              '                final controller = '
              'plPlayerController.videoController!;\n'
              '                final standbyController ='
          )
          start = text.index(start_marker)
          end = text.index('\n              },', start)
          replacement = '\n'.join([
              '                final controller = plPlayerController.videoController!;',
              '                return Transform.flip(',
              '                  flipX: plPlayerController.flipX.value,',
              '                  flipY: plPlayerController.flipY.value,',
              '                  child: FittedBox(',
              '                    fit: videoFit.boxFit,',
              '                    alignment: widget.alignment,',
              '                    child: SimpleVideo(',
              '                      key: ValueKey(controller),',
              '                      controller: controller,',
              '                      fill: widget.fill,',
              '                      aspectRatio: videoFit.aspectRatio,',
              '                    ),',
              '                  ),',
              '                );',
          ])
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          Path('.github/workflows/apply-fullscreen-video-output-fix.yml').unlink()

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/plugin/pl_player/view/view.dart .github/workflows/apply-fullscreen-video-output-fix.yml
          git commit -m "修复全屏切画质时左上角缩小画面"
          git push origin HEAD:agent/fix-fullscreen-video-output
