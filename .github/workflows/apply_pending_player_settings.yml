name: Apply pending player settings

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/trigger-player-settings'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mod
          fetch-depth: 0

      - name: Recover and apply validated patch
        id: apply_patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python3 <<'PYCODE'
          from pathlib import Path
          import subprocess

          workflow = subprocess.check_output(
              [
                  'git',
                  'show',
                  'a6d21178e66502694d98a6973a2cd6621de48343:.github/workflows/apply_pending_player_settings.yml',
              ],
              text=True,
          )
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index('          PY\n', start)
          block = workflow[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in block.splitlines()
          )
          script = script.replace('if count != 2:', 'if count != 3:', 1)
          script = script.replace(
              'controller lifecycle: expected 2 matches',
              'controller lifecycle: expected 3 matches',
              1,
          )
          lines = script.splitlines()
          if not lines[256].startswith('replace_once('):
              raise RuntimeError('unexpected seek cancellation patch position')
          lines[256:265] = [
              'replace_once(',
              "    'lib/plugin/pl_player/view/view.dart',",
              "    '          if (plPlayerController.showSeekPreview) {\\n            plPlayerController.showPreview.value = false;\\n          }\\n',",
              "    '          plPlayerController.showPreview.value = false;\\n',",
              ')',
          ]
          script = '\n'.join(lines)
          Path('/tmp/apply_pending_player_settings.py').write_text(script)
          PYCODE
            python3 /tmp/apply_pending_player_settings.py
          } 2>&1 | tee patch.log

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pending-player-settings-log
          path: patch.log

      - name: Commit source changes
        if: steps.apply_patch.outcome == 'success'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: split seek previews and customize control bars"
          git push origin HEAD:mod

      - name: Fail when patch validation failed
        if: steps.apply_patch.outcome != 'success'
        run: exit 1
