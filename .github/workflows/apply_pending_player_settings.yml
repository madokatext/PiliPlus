name: Apply pending player settings

on:
  push:
    branches:
      - mod
    paths:
      - .github/workflows/apply_pending_player_settings.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mod
          fetch-depth: 0

      - name: Apply source changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one match, found {count}')
              file.write_text(text.replace(old, new, 1))

          Path('lib/utils/player_control_prefs.dart').write_text("""import 'package:PiliPlus/utils/storage.dart';

abstract final class PlayerControlPrefs {
  static const String showSeekPreviewOnSliderKey =
          'showSeekPreviewOnSlider',
      showSeekPreviewOnGestureKey = 'showSeekPreviewOnGesture',
      controlBarThicknessScaleKey = 'playerControlBarThicknessScale',
      controlBarGradientExtentKey = 'playerControlBarGradientExtent';

  static bool get _legacyShowSeekPreview =>
      GStorage.setting.get('showSeekPreview', defaultValue: true);

  static bool get showSeekPreviewOnSlider => GStorage.setting.get(
    showSeekPreviewOnSliderKey,
    defaultValue: _legacyShowSeekPreview,
  );

  static bool get showSeekPreviewOnGesture => GStorage.setting.get(
    showSeekPreviewOnGestureKey,
    defaultValue: _legacyShowSeekPreview,
  );

  static double _getClampedDouble(
    String key,
    double defaultValue,
    double min,
    double max,
  ) {
    final value = GStorage.setting.get(key, defaultValue: defaultValue);
    return (value is num ? value.toDouble() : defaultValue)
        .clamp(min, max)
        .toDouble();
  }

  static double get controlBarThicknessScale => _getClampedDouble(
    controlBarThicknessScaleKey,
    1.0,
    0.8,
    1.5,
  );

  static double get controlBarGradientExtent => _getClampedDouble(
    controlBarGradientExtentKey,
    0.0,
    0.0,
    96.0,
  );
}
""")

          Path('lib/pages/setting/models/player_control_settings.dart').write_text("""import 'package:PiliPlus/pages/setting/models/model.dart';
import 'package:PiliPlus/pages/setting/widgets/slider_dialog.dart';
import 'package:PiliPlus/utils/player_control_prefs.dart';
import 'package:PiliPlus/utils/storage.dart';
import 'package:flutter/material.dart';
import 'package:get/get.dart';

List<SettingsModel> get seekPreviewModeSettings => [
  const SwitchModel(
    title: '拖动进度条滑块显示预览浮窗',
    subtitle: '拖动播放器底部进度条时显示视频缩略图',
    leading: Icon(Icons.linear_scale),
    setKey: PlayerControlPrefs.showSeekPreviewOnSliderKey,
    defaultVal: true,
  ),
  const SwitchModel(
    title: '左右滑动手势显示预览浮窗',
    subtitle: '在播放器画面上左右滑动快进或快退时显示视频缩略图',
    leading: Icon(Icons.swipe),
    setKey: PlayerControlPrefs.showSeekPreviewOnGestureKey,
    defaultVal: true,
  ),
];

List<SettingsModel> get playerControlBarSettings => [
  NormalModel(
    title: '上下控制栏整体厚度',
    getSubtitle: () =>
        '当前：${PlayerControlPrefs.controlBarThicknessScale.toStringAsFixed(2)}×',
    leading: const Icon(Icons.height),
    onTap: _showControlBarThicknessDialog,
  ),
  NormalModel(
    title: '控制栏渐变阴影弥散宽度',
    getSubtitle: () =>
        '当前：${PlayerControlPrefs.controlBarGradientExtent.toStringAsFixed(0)}dp',
    leading: const Icon(Icons.gradient_outlined),
    onTap: _showControlBarGradientExtentDialog,
  ),
];

Future<void> _showControlBarThicknessDialog(
  BuildContext context,
  VoidCallback setState,
) async {
  final res = await showDialog<double>(
    context: context,
    builder: (context) => SliderDialog(
      title: const Text('上下控制栏整体厚度'),
      value: PlayerControlPrefs.controlBarThicknessScale,
      min: 0.8,
      max: 1.5,
      divisions: 14,
      precise: 2,
      suffix: '×',
    ),
  );
  if (res != null) {
    await GStorage.setting.put(
      PlayerControlPrefs.controlBarThicknessScaleKey,
      res,
    );
    setState();
    Get.appUpdate();
  }
}

Future<void> _showControlBarGradientExtentDialog(
  BuildContext context,
  VoidCallback setState,
) async {
  final res = await showDialog<double>(
    context: context,
    builder: (context) => SliderDialog(
      title: const Text('控制栏渐变阴影弥散宽度'),
      value: PlayerControlPrefs.controlBarGradientExtent,
      min: 0,
      max: 96,
      divisions: 24,
      precise: 0,
      suffix: 'dp',
    ),
  );
  if (res != null) {
    await GStorage.setting.put(
      PlayerControlPrefs.controlBarGradientExtentKey,
      res,
    );
    setState();
    Get.appUpdate();
  }
}
""")

