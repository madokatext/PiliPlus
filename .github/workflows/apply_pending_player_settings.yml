  final settings = <SettingsModel>[...playSettings];
  final legacyPreviewIndex = settings.indexWhere(
    (item) => item.title == '滑动跳转预览视频缩略图',
  );
  if (legacyPreviewIndex >= 0) {
    settings
      ..removeAt(legacyPreviewIndex)
      ..insertAll(legacyPreviewIndex, seekPreviewModeSettings);
  }
  final horizontalPaddingIndex = settings.indexWhere(
    (item) => item.title == '播放器上下按钮横向边距',
  );
  settings.insertAll(
    horizontalPaddingIndex < 0 ? 0 : horizontalPaddingIndex + 1,
    playerControlBarSettings,
  );
  return settings;
}

List<SettingsModel> get _styleSettingsWithHomeCardLayout {
