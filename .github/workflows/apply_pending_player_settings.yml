name: Apply pending player settings

on:
  pull_request_target:
    types: [opened]
    branches: [mod]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/trigger-player-settings'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mod
          fetch-depth: 0

      - name: Recover and apply validated patch
        shell: bash
        run: |
          python3 <<'PYCODE'
          from pathlib import Path
          import subprocess

          workflow = subprocess.check_output(
              [
                  'git',
                  'show',
                  'a6d21178e66502694d98a6973a2cd6621de48343:.github/workflows/apply_pending_player_settings.yml',
              ],
              text=True,
          )
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index('          PY\n', start)
          block = workflow[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in block.splitlines()
          )
          Path('/tmp/apply_pending_player_settings.py').write_text(script)
          PYCODE
          python3 /tmp/apply_pending_player_settings.py

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: split seek previews and customize control bars"
          git push origin HEAD:mod
