name: Apply pending player settings

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/trigger-player-settings'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mod
          fetch-depth: 0

      - name: Recover and apply validated patch
        id: apply_patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python3 <<'PYCODE'
          from pathlib import Path
          import subprocess

          workflow = subprocess.check_output(
              [
                  'git',
                  'show',
                  'a6d21178e66502694d98a6973a2cd6621de48343:.github/workflows/apply_pending_player_settings.yml',
              ],
              text=True,
          )
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index('          PY\n', start)
          block = workflow[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in block.splitlines()
          )
          script = script.replace('if count != 2:', 'if count != 3:', 1)
          script = script.replace(
              'controller lifecycle: expected 2 matches',
              'controller lifecycle: expected 3 matches',
              1,
          )
          lines = script.splitlines()
          if not lines[256].startswith('replace_once('):
              raise RuntimeError('unexpected seek cancellation patch position')
          lines[256:265] = [
              'replace_once(',
              "    'lib/plugin/pl_player/view/view.dart',",
              "    '          if (plPlayerController.showSeekPreview) {\\n            plPlayerController.showPreview.value = false;\\n          }\\n',",
              "    '          plPlayerController.showPreview.value = false;\\n',",
              ')',
          ]

          appbar_content = '''import 'package:PiliPlus/common/widgets/view_safe_area.dart';
import 'package:flutter/material.dart';

class AppBarAni extends StatelessWidget {
  const AppBarAni({
    super.key,
    required this.child,
    required this.controller,
    required this.isTop,
    required this.isFullScreen,
    required this.removeSafeArea,
    this.bottomPadding = 0,
    this.gradientExtent = 0,
  });

  final Widget child;
  final AnimationController controller;
  final bool isTop;
  final bool isFullScreen;
  final bool removeSafeArea;
  final double bottomPadding;
  final double gradientExtent;

  static final _topPos = Tween<Offset>(
    begin: const Offset(0.0, -1.0),
    end: Offset.zero,
  );

  static const _topDecoration = LinearGradient(
    begin: Alignment.bottomCenter,
    end: Alignment.topCenter,
    colors: <Color>[
      Colors.transparent,
      Color(0xBF000000),
    ],
    tileMode: TileMode.mirror,
  );

  static final _bottomPos = Tween<Offset>(
    begin: const Offset(0, 1.2),
    end: Offset.zero,
  );

  static const _bottomDecoration = LinearGradient(
    begin: Alignment.topCenter,
    end: Alignment.bottomCenter,
    colors: <Color>[
      Colors.transparent,
      Color(0xBF000000),
    ],
    tileMode: TileMode.mirror,
  );

  @override
  Widget build(BuildContext context) {
    final content = Padding(
      padding: EdgeInsets.only(bottom: isTop ? 0 : bottomPadding),
      child: removeSafeArea
          ? child
          : ViewSafeArea(
              left: isFullScreen,
              right: isFullScreen,
              child: child,
            ),
    );

    return SlideTransition(
      position: controller.drive(isTop ? _topPos : _bottomPos),
      child: DecoratedBox(
        decoration: BoxDecoration(
          gradient: isTop ? _topDecoration : _bottomDecoration,
        ),
        child: Padding(
          padding: EdgeInsets.only(
            top: isTop ? 0 : gradientExtent,
            bottom: isTop ? gradientExtent : 0,
          ),
          child: content,
        ),
      ),
    );
  }
}
'''
          appbar_start = next(
              i for i, line in enumerate(lines)
              if "'lib/plugin/pl_player/widgets/app_bar_ani.dart'" in line
          ) - 1
          appbar_end = next(
              i for i, line in enumerate(lines)
              if "Path('.github/workflows/apply_pending_player_settings.yml').unlink()" in line
          )
          lines[appbar_start:appbar_end] = [
              "Path('lib/plugin/pl_player/widgets/app_bar_ani.dart').write_text(" + repr(appbar_content) + ")"
          ]
          script = '\n'.join(lines)
          Path('/tmp/apply_pending_player_settings.py').write_text(script)
          PYCODE
            python3 /tmp/apply_pending_player_settings.py
          } 2>&1 | tee patch.log

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pending-player-settings-log
          path: patch.log

      - name: Commit source changes
        if: steps.apply_patch.outcome == 'success'
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: split seek previews and customize control bars"
          git push origin HEAD:mod

      - name: Fail when patch validation failed
        if: steps.apply_patch.outcome != 'success'
        run: exit 1
